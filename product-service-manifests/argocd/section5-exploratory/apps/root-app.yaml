# Section 5 실습용 — App of Apps 패턴. 이 부모 Application을 apply하면
# children/ 디렉터리 안의 자식 Application들이 자동으로 생성됩니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: product-service
  source:
    repoURL: https://github.com/<내계정>/product-service-manifests.git
    targetRevision: main
    path: argocd/section5-exploratory/apps/children
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
