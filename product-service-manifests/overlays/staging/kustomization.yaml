apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-service-staging
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: product-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
images:
  - name: product-service
    newTag: local
